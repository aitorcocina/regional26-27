<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gorliz Regional 26/27</title>
<meta name="theme-color" content="#C8191F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#C8191F;--card:#FFFFFF;--card2:#EEF2EF;--ink:#171717;--dim:rgba(23,23,23,.58);--faint:rgba(23,23,23,.11);--red:#009B48;--acc:#009B48;--onred:rgba(255,255,255,.88);--green:#2EB85C;--yel:#FACC15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg) fixed;color:#fff;font-family:Inter,system-ui,sans-serif}
body{padding:0 16px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h1,h2,.h{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em}
header.top{display:flex;align-items:center;gap:12px;background:#009B48;color:#fff;border-radius:20px;padding:14px;margin:calc(12px + env(safe-area-inset-top)) 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
header.top img{width:38px;height:38px;border-radius:10px}
header.top b{font-family:Oswald;letter-spacing:.08em;font-size:17px;text-transform:uppercase;display:block;line-height:1.1}
header.top small{color:rgba(255,255,255,.9);font-size:12px}
.view{display:none}.view.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{color:var(--ink);background:var(--card);border:1px solid var(--faint);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.h{font-size:13px;color:var(--acc);margin:0 0 10px}
.sub{font-size:12px;color:var(--dim);margin:-4px 0 12px}
.next{font-weight:600;font-size:16px}.next small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:3px}
table.lg{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.lg th{font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:600;text-align:right;padding:4px 3px}
.lg td{padding:8px 3px;text-align:right;border-top:1px solid var(--faint)}
.lg th:nth-child(2),.lg td:nth-child(2){text-align:left}
.lg td:nth-child(2){max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg td:first-child,.lg th:first-child{text-align:center;width:26px}
.lg td.pts{font-weight:700}
.lg tr.yo td{font-weight:700;color:var(--ink)}
.lg tr.yo td:nth-child(2){text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
.lg tr.za td{background:rgba(0,155,72,.2)}.lg tr.zp td{background:rgba(250,204,21,.45)}.lg tr.zd td{background:rgba(213,43,30,.2)}
.lg tr.za td:first-child{box-shadow:inset 4px 0 0 var(--green)}.lg tr.zp td:first-child{box-shadow:inset 4px 0 0 var(--yel)}.lg tr.zd td:first-child{box-shadow:inset 4px 0 0 #D52B1E}
.ley{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11px;color:var(--dim)}
.ley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--faint);font-size:13px}
.m:first-of-type{border-top:0}
.m .f{grid-column:1/-1;font-size:11px;color:var(--dim)}
.m .l{text-align:right}.m .r{font-weight:700;background:var(--card2);border-radius:8px;padding:2px 9px;min-width:48px;text-align:center}
.m .yo{font-weight:700;color:#007a38}.m .yo:before{content:"";}
.chip{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;letter-spacing:.05em}
.gan{background:rgba(0,155,72,.16);color:#007a38}.emp{background:rgba(23,23,23,.1);color:#555}.per{background:rgba(213,43,30,.15);color:#c0161c}
.pie{font-size:11px;color:var(--dim);text-align:center;margin:6px 0 4px}
.pl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{color:var(--ink);background:var(--card);border:1px solid var(--faint);border-radius:18px;padding:12px;position:relative;overflow:hidden}
.pc .n{position:absolute;right:10px;top:2px;font-family:Oswald;font-size:38px;color:#009B48;font-weight:700}
.pc b{font-size:14px;display:block;padding-right:34px;line-height:1.2}.pc small{color:var(--dim);font-size:11px}
.st{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.6fr;gap:4px;margin-top:10px;text-align:center}
.st div{background:#009B48;color:#fff;border-radius:10px;padding:6px 0}.st strong{display:block;font-size:16.5px}.st span{font-size:9px;color:rgba(255,255,255,.85);letter-spacing:.06em}
.btn{border:0;border-radius:12px;padding:6px 11px;font-size:12px;font-weight:600;background:var(--red);color:#fff;cursor:pointer;margin-top:6px}
nav.tabbar{box-shadow:0 -2px 12px rgba(0,0,0,.2);position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--faint);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20;max-width:720px;margin:0 auto}
nav.tabbar button{flex:1;background:0;border:0;color:var(--dim);font:600 11px Inter;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
nav.tabbar svg{width:24px;height:24px}nav.tabbar .on{color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{color:var(--ink);background:#fff;width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px;animation:in .3s}
.sheet .x{float:right;background:var(--card2);border:0;color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.marc{text-align:center;font-family:Oswald;font-size:34px;margin:6px 0}.marc small{display:block;font-family:Inter;font-size:12px;color:var(--dim)}
.sheet h3{font-family:Oswald;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--acc);margin:16px 0 6px}
.sheet li{font-size:13px;padding:4px 0;list-style:none;border-top:1px solid var(--faint);display:flex;gap:8px}.sheet ul{margin:0;padding:0}
.sheet li em{font-style:normal;color:var(--dim);min-width:34px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 45%,#ffffff,#e7efe9 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s}
#splash.off{opacity:0;visibility:hidden}
#logo{position:relative;width:min(62vw,300px);aspect-ratio:1}
#logo i{filter:drop-shadow(0 6px 18px rgba(0,0,0,.25));position:absolute;left:0;width:100%;background:url(um-logo.png) center/100% 100%;will-change:transform,opacity,filter}
#logo:after{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(0,155,72,.4),transparent 62%);opacity:0;animation:glow 5s ease both;z-index:-1}
@keyframes glow{0%,34%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}100%{opacity:.5;transform:scale(1)}}
#sname{margin-top:30px;display:flex;gap:.34em;font-family:Oswald;font-weight:700;font-size:clamp(26px,8vw,44px);letter-spacing:.1em}
#sname span{display:inline-block;opacity:0}
#ssub{margin-top:8px;font:600 12px Inter;letter-spacing:.5em;color:#C8191F;opacity:0;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){#logo i,#sname span,#ssub{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}}
main>section>.sub,main>section>.pie{color:var(--onred)}
nav.tabbar button{color:rgba(23,23,23,.55)}
.sheet h3{color:var(--acc)}
#v-liga .h[style],h2.h{color:#fff}
#sname{color:#009B48}
</style></head><body>

<div id="splash"><div id="logo"></div><div id="sname"></div><div id="ssub">Regional · 26/27</div></div>

<header class="top"><img src="um-logo.png" alt=""><div><b>Gorliz K.E.</b><small id="cabecera">Regional · Segunda División Bizkaia G2</small></div></header>

<main>
<section class="view on" id="v-liga"></section>
<section class="view" id="v-plantilla"></section>
<section class="view" id="v-partidos"></section>
</main>

<nav class="tabbar">
<button data-v="liga" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/></svg>Liga</button>
<button data-v="plantilla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5a3 3 0 0 1 0 6M18 14c2 .7 3 2.6 3 5"/></svg>Plantilla</button>
<button data-v="partidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4zM12 3v5M20 9.5l-4.5 1M18 18.5l-3.8-4M6 18.5l3.8-4M4 9.5l4.5 1"/></svg>Partidos</button>
</nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';
var SB='https://bzjzedwbahgitunoksps.supabase.co',KEY='sb_publishable_GwXGrJorusdd94VeHBH4Lg_C657Knj5',LS='gorliz-regional-cache-v1';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function yo(n){return String(n).toLowerCase().replace(/"/g,'').indexOf('gorliz')===0}
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],DIA=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function fecha(d,h){if(!d)return'Fecha por confirmar';var p=d.split('-'),x=new Date(+p[0],p[1]-1,+p[2]);return DIA[x.getDay()]+' '+x.getDate()+' '+MES[x.getMonth()]+(h?' · '+h:'')}

/* ---------- splash ---------- */
function splash(){
  var L=$('#logo'),N=7,i,reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  for(i=0;i<N;i++){var s=document.createElement('i');s.style.top=(i*100/N)+'%';s.style.height=(100/N+.4)+'%';s.style.backgroundSize='100% '+(N*100)+'%';s.style.backgroundPosition='center '+(i*100/(N-1))+'%';
    var dir=i%2?1:-1;
    s.animate([{transform:'translateX('+dir*120+'vw) rotate('+dir*14+'deg) scale(.6)',opacity:0,filter:'blur(8px)',easing:'cubic-bezier(.2,.8,.2,1)'},{transform:'none',opacity:1,filter:'blur(0)',offset:.36},{transform:'none',opacity:1,filter:'blur(0)',offset:.8,easing:'ease-in'},{transform:'translateX('+(-dir*120)+'vw) rotate('+(-dir*10)+'deg)',opacity:0,filter:'blur(8px)'}],{duration:reduce?10:5000,delay:reduce?0:i*80,easing:'linear',fill:'both'});
    L.appendChild(s)}
  var nm=$('#sname'),t='GORLIZ'.split('');
  t.forEach(function(c,k){var s=document.createElement('span');s.textContent=c;nm.appendChild(s);var from=(k-2.5)*60;
    s.animate([{opacity:0,transform:'translate('+from+'px,'+(k%2?-40:40)+'px) scale(.4)',filter:'blur(6px)',easing:'ease-out'},{opacity:1,transform:'none',filter:'blur(0)',offset:.4},{opacity:1,transform:'none',offset:.8,easing:'ease-in'},{opacity:0,transform:'translate('+(-from)+'px,'+(k%2?40:-40)+'px) scale(.4)',filter:'blur(6px)'}],{duration:4400,delay:900+k*90,fill:'both',easing:'linear'})});
  $('#ssub').animate([{opacity:0},{opacity:1,offset:.4},{opacity:1,offset:.8},{opacity:0}],{duration:3600,delay:1500,fill:'both'});
  setTimeout(function(){$('#splash').classList.add('off')},reduce?600:5600);
  setTimeout(function(){var s=$('#splash');s&&s.remove()},6600);
  $('#splash').addEventListener('click',function(){this.classList.add('off')});
}
splash();

/* ---------- datos ---------- */
var D={};
function leer(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function guardar(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
function cargar(){
  var ctl=window.AbortController?new AbortController():null;if(ctl)setTimeout(function(){ctl.abort()},8000);
  var q='team_data?select=key,value&key=in.(competicion,regional:players,regional:stats,regional:matches,regional:actas)';
  return fetch(SB+'/rest/v1/'+q,{headers:{apikey:KEY},signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
    var o={};rows.forEach(function(r){o[r.key]=r.value});guardar(o);return o});
}
function pintarTodo(){
  var C=(D.competicion||{}).regional||{};
  if(!C.clasificacion)return;
  liga(C);plantilla();partidos();
}

/* ---------- Liga ---------- */
function liga(C){
  var z=C.zonas||[],h='<h2 class="h" style="color:#fff;font-size:20px;margin:6px 0 2px">Liga</h2><div class="sub">'+esc(C.competicion)+' · '+esc(C.jornada)+'</div>';
  var prox=((C.proximos||{}).partidos||[]).filter(function(m){return yo(m[1])||yo(m[3])})[0];
  if(prox)h+='<div class="card"><div class="h">Próximo partido · '+esc(C.proximos.titulo)+'</div><div class="next">'+esc(prox[1])+' <span style="color:var(--dim)">vs</span> '+esc(prox[3])+'<small>'+esc(prox[0])+'</small></div></div>';
  h+='<div class="card"><div class="h">Clasificación</div><table class="lg"><tr><th>#</th><th>EQUIPO</th><th>PTS</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th></tr>';
  C.clasificacion.forEach(function(t,i){var zc={A:'za',P:'zp',D:'zd'}[z[i]]||'';
    h+='<tr class="'+(yo(t[0])?'yo ':'')+zc+'"><td>'+(i+1)+'</td><td>'+esc(t[0])+'</td><td class="pts">'+t[1]+'</td><td>'+t[2]+'</td><td>'+t[3]+'</td><td>'+t[4]+'</td><td>'+t[5]+'</td><td>'+t[6]+'</td><td>'+t[7]+'</td></tr>'});
  h+='</table><div class="ley"><span><i style="background:#2EB85C"></i>Ascenso</span><span><i style="background:#FACC15"></i>Promoción</span><span><i style="background:#E53935"></i>Descenso</span></div></div>';
  function filas(a){return a.map(function(m){return '<div class="m"><div class="f">'+esc(m[0])+'</div><div class="l'+(yo(m[1])?' yo':'')+'">'+esc(m[1])+'</div><div class="r">'+esc(m[2]||'vs')+'</div><div class="'+(yo(m[3])?'yo':'')+'">'+esc(m[3])+'</div></div>'}).join('')}
  h+='<div class="card"><div class="h">Resultados · '+esc(C.ultimos.titulo)+'</div>'+filas(C.ultimos.partidos)+'</div>';
  h+='<div class="card"><div class="h">Próxima jornada · '+esc(C.proximos.titulo)+'</div>'+filas(C.proximos.partidos)+'</div>';
  h+='<div class="pie">Actualizado: '+esc((D.competicion||{}).actualizado)+' · Fuente: Federación Vizcaína de Fútbol</div>';
  $('#v-liga').innerHTML=h;
}

/* ---------- Plantilla ---------- */
function plantilla(){
  var P=(D['regional:players']||[]).slice(),S=D['regional:stats']||{};
  P.sort(function(a,b){return (+a.number||99)-(+b.number||99)});
  var h='<h2 class="h" style="color:#fff;font-size:20px;margin:6px 0 2px">Plantilla</h2><div class="sub">'+P.length+' jugadores · estadísticas de la Liga</div><div class="pl">';
  P.forEach(function(p){var s=S[p.id]||{},c=s.counts||{},pj=(c.titular||0)+(c.suplente||0);
    h+='<div class="pc"><span class="n">'+esc(p.number||'')+'</span><b>'+esc(p.nombre)+'<br>'+esc(p.apellidos)+'</b>'+
    '<div class="st"><div><strong>'+pj+'</strong><span>PJ</span></div><div><strong>'+(s.goals||0)+'</strong><span>GOL</span></div><div><strong>'+(s.yellow||0)+'</strong><span>AMA</span></div><div><strong>'+(s.red||0)+'</strong><span>ROJ</span></div><div><strong>'+(s.minutes||0)+'</strong><span>MIN</span></div></div></div>'});
  h+='</div><div class="pie">Datos extraídos de las actas oficiales de la FVF</div>';
  $('#v-plantilla').innerHTML=h;
}

/* ---------- Partidos ---------- */
function partidos(){
  var M=(D['regional:matches']||[]).slice().sort(function(a,b){return a.jornada-b.jornada}),A=D['regional:actas']||{};
  var g=0,e=0,p=0,gf=0,gc=0,h='';
  var items=M.map(function(m){
    var jug=m.scoreFor!==''&&m.scoreFor!=null,casa=m.venue==='casa',nos=yo('Gorliz'),res='',marc;
    if(jug){gf+=m.scoreFor;gc+=m.scoreAgainst;res=m.scoreFor>m.scoreAgainst?'G':m.scoreFor<m.scoreAgainst?'P':'E';res==='G'?g++:res==='P'?p++:e++;
      marc=casa?m.scoreFor+'-'+m.scoreAgainst:m.scoreAgainst+'-'+m.scoreFor}else marc='vs';
    var L=casa?'Gorliz':m.rival,V=casa?m.rival:'Gorliz';
    return {m:m,jug:jug,html:'<div class="m"><div class="f">J'+m.jornada+' · '+esc(fecha(m.date,m.hora))+' · '+(casa?'Casa':'Fuera')+(res?'<span class="chip '+({G:'gan',E:'emp',P:'per'})[res]+'">'+({G:'GANADO',E:'EMPATE',P:'PERDIDO'})[res]+'</span>':'')+'</div><div class="l'+(casa?' yo':'')+'">'+esc(L)+'</div><div class="r">'+marc+'</div><div class="'+(casa?'':'yo')+'">'+esc(V)+'</div>'+(A[m.id]?'<div class="f"><button class="btn" data-a="'+esc(m.id)+'">Acta del partido</button></div>':'')+'</div>'};
  });
  h='<h2 class="h" style="color:#fff;font-size:20px;margin:6px 0 2px">Partidos</h2><div class="sub">Calendario completo de Liga · Regional</div>';
  var pj=g+e+p,dif=gf-gc;
  h+='<div class="card"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center">'+[['PJ',pj],['G',g],['E',e],['P',p],['GF',gf],['GC',gc]].map(function(x){return '<div style="background:var(--card2);border-radius:12px;padding:8px 0"><div style="font-size:18px;font-weight:700">'+x[1]+'</div><div style="font-size:10px;color:var(--dim)">'+x[0]+'</div></div>'}).join('')+'</div><div class="sub" style="margin:8px 0 0">Diferencia de goles: '+(dif>0?'+':'')+dif+'</div></div>';
  var jugados=items.filter(function(i){return i.jug}),prox=items.filter(function(i){return !i.jug});
  h+='<div class="card"><div class="h">Jugados</div>'+(jugados.length?jugados.map(function(i){return i.html}).join(''):'<div class="sub">Aún no hay partidos jugados.</div>')+'</div>';
  if(prox.length)h+='<div class="card"><div class="h">Próximos partidos</div>'+prox.map(function(i){return i.html}).join('')+'</div>';
  $('#v-partidos').innerHTML=h;
}

/* ---------- Acta ---------- */
function acta(id){
  var a=(D['regional:actas']||{})[id];if(!a)return;
  var rival=a.casa?a.visitante:a.local,h='<button class="x" id="cerrar">×</button><div class="h" style="margin:0">Acta · Jornada '+a.jornada+'</div><div class="marc">'+esc(a.local)+' '+a.gl+' – '+a.gv+' '+esc(a.visitante)+'<small>'+esc(a.fecha)+' · '+esc(a.hora)+' · '+esc(a.campo)+'<br>Árbitro: '+esc(a.arbitro)+'</small></div>';
  if((a.goles||[]).length)h+='<h3>Goles</h3><ul>'+a.goles.map(function(x){return '<li><em>'+x.min+"'</em><span>⚽ "+esc(x.nombre)+(x.nuestro?'':' <span style="color:var(--dim)">('+esc(rival)+')</span>')+' <b>'+esc(x.marcador)+'</b></span></li>'}).join('')+'</ul>';
  if((a.tarjetas||[]).length)h+='<h3>Tarjetas</h3><ul>'+a.tarjetas.map(function(x){return '<li><em>'+x.min+"'</em><span>"+(x.tipo==='amar'?'🟨':'🟥')+' '+esc(x.nombre)+'</span></li>'}).join('')+'</ul>';
  if((a.cambios||[]).length)h+='<h3>Cambios</h3><ul>'+a.cambios.map(function(x){return '<li><em>'+x.min+"'</em><span>↘ "+esc(x.sale)+' · ↗ '+esc(x.entra)+'</span></li>'}).join('')+'</ul>';
  h+='<h3>Titulares</h3><ul>'+(a.titulares||[]).map(function(x){return '<li><em>'+esc(x.dorsal)+'</em><span>'+esc(x.nombre)+'</span></li>'}).join('')+'</ul>';
  h+='<h3>Suplentes</h3><ul>'+(a.suplentes||[]).map(function(x){return '<li><em>'+esc(x.dorsal)+'</em><span>'+esc(x.nombre)+'</span></li>'}).join('')+'</ul>';
  $('#sheet').innerHTML=h;$('#modal').classList.add('on');$('#cerrar').onclick=cerrar;
}
function cerrar(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',function(e){if(e.target===this)cerrar()});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(b)acta(b.getAttribute('data-a'))});

/* ---------- pestañas ---------- */
document.querySelectorAll('nav.tabbar button').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('nav.tabbar button').forEach(function(x){x.classList.remove('on')});
  document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');$('#v-'+b.dataset.v).classList.add('on');window.scrollTo(0,0)})});

var c=leer();if(c){D=c;pintarTodo()}
cargar().then(function(o){D=o;pintarTodo()}).catch(function(){
  if(!c)$('#v-liga').innerHTML='<div class="card"><div class="h">Sin conexión</div><div class="sub">No se han podido cargar los datos. Inténtalo de nuevo en un momento.</div></div>'});
})();
